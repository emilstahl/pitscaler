<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PitScaler logo: dusty old server with a cracked pit">
  <rect width="64" height="64" rx="12" fill="#0b0f14"/>
  <!-- two rack units -->
  <rect x="8" y="14" width="48" height="16" rx="3" fill="#2a3341" stroke="#6b7686" stroke-width="1.5"/>
  <rect x="8" y="34" width="48" height="16" rx="3" fill="#2a3341" stroke="#6b7686" stroke-width="1.5"/>
  <!-- drive slots -->
  <rect x="13" y="19" width="14" height="2.5" rx="1" fill="#141a22"/>
  <rect x="13" y="23.5" width="14" height="2.5" rx="1" fill="#141a22"/>
  <rect x="13" y="39" width="14" height="2.5" rx="1" fill="#141a22"/>
  <rect x="13" y="43.5" width="14" height="2.5" rx="1" fill="#141a22"/>
  <!-- status LEDs: one green, one alarm red -->
  <circle cx="50" cy="22" r="2.2" fill="#6fd39a"/>
  <circle cx="50" cy="42" r="2.2" fill="#ff6b5e"/>
  <!-- the pit: a crack punched through both units -->
  <path d="M36 12 L33 22 L39 27 L34 35 L40 41 L35 52" fill="none" stroke="#f5b547" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- cobweb in the top-left corner -->
  <path d="M8 8 L20 8 M8 8 L8 20 M8 8 L17 17 M11 8 Q10 10 8 11 M15 8 Q13 13 8 15 M19 8 Q16 16 8 19" fill="none" stroke="#a5b1bf" stroke-width=".8" opacity=".7"/>
  <!-- dust -->
  <g fill="#a5b1bf" opacity=".45"><circle cx="22" cy="31.5" r=".8"/><circle cx="28" cy="31" r=".6"/><circle cx="45" cy="31.6" r=".7"/><circle cx="17" cy="52" r=".7"/><circle cx="44" cy="52.5" r=".6"/></g>
</svg>
